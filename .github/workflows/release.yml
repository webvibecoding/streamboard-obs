name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    uses: ./.github/workflows/ci.yml
    secrets: inherit
  draft:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: streamboard-obs-windows
          path: assets
      - name: Verify packaged checksums
        working-directory: assets
        run: sha256sum --check SHA256SUMS.txt
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r .version buildspec.json)
          test "$GITHUB_REF_NAME" = "v$version"
          gh release create "v$version" --verify-tag --draft --title "Streamboard OBS $version" --notes-file "docs/releases/$version.md" assets/*
